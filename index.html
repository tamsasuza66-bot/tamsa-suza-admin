<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>TAMSA SUZA Admin</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body>
<header><img src="logo-tamsa.png" alt=""><img src="logo-suza.jpg" alt=""><b>Election Admin<small>TAMSA SUZA</small></b></header><main id="app"></main><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="common.js"></script>
<script>
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return loginView();
 const{data}=await sb.from("admins").select("user_id");if(!data||!data.length){$("app").innerHTML='<div class="card"><h3>Not an admin</h3><p class="mut">This account is not in the admins table.</p><button class="btn o" onclick="out()">Sign out</button></div>';return}panel()}
const out=async()=>{await sb.auth.signOut();boot()};
function loginView(){$("app").innerHTML=`<h2>Admin sign in</h2><div class="card"><label>Email</label><input id="e" type="email"><label>Password</label><input id="p" type="password"><br><button class="btn" id="b" style="width:100%">Sign in</button></div>`;
 $("b").onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$("e").value.trim(),password:$("p").value});error?toast(error.message):boot()}}
async function panel(){const S=await getSettings(),{data:C}=await sb.from("candidates").select("id,name,reg_no,phone,position,txn_id,status").order("created_at"),{data:V}=await sb.from("voters").select("reg_no"),{count:roll}=await sb.from("voter_roll").select("*",{count:"exact",head:true});
 const sw=(k,l)=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span>${l}</span><button class="btn s ${S[k]?"":"o"}" onclick="tg('${k}',${!S[k]})">${S[k]?"ON — tap to turn off":"OFF — tap to turn on"}</button></div>`;
 $("app").innerHTML=`<h2>Control panel</h2><div class="card">${sw("reg_open","Candidate applications")}${sw("voting_open","Voting")}${sw("results_published","Publish results")}</div>
 <div class="stat"><div><b>${C.length}</b>Applicants</div><div><b>${C.filter(c=>c.status==="pending").length}</b>To verify</div><div><b>${V.length}</b>Votes cast</div><div><b>${roll||0}</b>Voter roll</div></div>
 <h2>Candidates &amp; payments</h2><div class="card">${C.map(c=>`<div style="border-bottom:1px solid var(--bd);padding:10px 0"><div class="row" style="justify-content:space-between"><b>${esc(c.name)}</b><span class="tag ${c.status==="verified"?"ok":c.status==="removed"?"bad":"w"}">${c.status}</span></div><div class="mut">${esc(c.reg_no)} · ${esc(c.phone)} · ${esc(P(c.position).n)}${c.txn_id?" · Txn <b>"+esc(c.txn_id)+"</b>":""}</div>
 <div class="row" style="margin-top:6px">${c.status==="pending"?`<button class="btn s" onclick="st('${c.id}','verified')">Verify payment</button>`:""}${c.status!=="removed"?`<button class="btn s r" onclick="if(confirm('Remove this candidate?'))st('${c.id}','removed')">Remove</button>`:`<button class="btn s o" onclick="st('${c.id}','pending')">Restore</button>`}</div></div>`).join("")||'<span class="mut">No applicants yet.</span>'}</div>
 <h2>Voter roll</h2><div class="card"><p class="mut">Paste one voter per line: <code>MD/00/00/001/TZ, Full Name</code>. Once any voter is added, only listed students can vote.</p><textarea id="vr" rows="5"></textarea><br><div class="row"><button class="btn s" onclick="roll()">Upload</button></div></div>
 <div class="row"><button class="btn o s" onclick="csv()">Download results CSV</button><button class="btn o s" onclick="out()">Sign out</button></div>`}
async function tg(k,v){const{error}=await sb.from("settings").update({[k]:v}).eq("id",1);if(error)toast(error.message);panel()}
async function st(id,s){const{error}=await sb.from("candidates").update({status:s}).eq("id",id);if(error)toast(error.message);panel()}
async function roll(){const rows=$("vr").value.split("\n").map(l=>l.split(",")).filter(a=>a[0].trim()).map(a=>({reg_no:a[0].trim().toUpperCase(),full_name:(a[1]||"").trim()}));if(!rows.length)return;const{error}=await sb.from("voter_roll").upsert(rows);toast(error?error.message:rows.length+" voters saved");panel()}
async function csv(){const R=await rpc("get_results"),{data:C}=await sb.from("candidates").select("id,name");const t="position,candidate,votes\n"+R.map(r=>[P(r.pos).n,(C.find(c=>c.id===r.cand_id)||{}).name,r.cnt].join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="results.csv";a.click()}
boot();
</script></body></html>
