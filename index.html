<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>TAMSA SUZA Admin</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><style>
#pr{display:none}
@media print{@page{size:A4;margin:14mm}header,main,#t{display:none!important}#pr{display:block;color:#000;background:#fff;font:12px/1.4 system-ui,sans-serif}body{background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ph-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #2b6cb3;padding-bottom:8px;margin-bottom:12px}.ph-head img{height:64px;width:64px;object-fit:contain}.ph-head div{flex:1;text-align:center}.ph-head h1{margin:0;font-size:20px;color:#12467f}
#pr h2{text-align:center;color:#12467f;font-size:16px;margin:10px 0}#pr h3{margin:12px 0 4px;font-size:13px;color:#12467f;border-left:4px solid #f2c230;padding-left:6px}
table.pt{width:100%;border-collapse:collapse;margin:6px 0}table.pt td,table.pt th{border:1px solid #9fb8cc;padding:5px 7px;text-align:left}table.pt th{background:#12467f;color:#fff}table.pt td b{display:block;font-size:16px}tr.win td{background:#fff6d1;font-weight:700}
.sig{display:flex;gap:30px;margin-top:44px}.sig div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}.ph-foot{margin-top:14px;font-size:10px;color:#555;text-align:center}#pr .card{border:1px solid #9fb8cc;box-shadow:none;break-inside:avoid}#pr .grid{display:flex;gap:12px}#pr .grid>*{flex:1}.pb{break-before:page}}
</style></head><body>
<header><img src="logo-tamsa.png" alt=""><img src="logo-suza.jpg" alt=""><b>Election Admin<small>TAMSA SUZA</small></b></header><main id="app"></main><div id="pr"></div><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="common.js"></script>
<script>
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return loginView();
 const{data}=await sb.from("admins").select("user_id");if(!data||!data.length){$("app").innerHTML='<div class="card"><h3>Not an admin</h3><p class="mut">This account is not in the admins table.</p><button class="btn o" onclick="out()">Sign out</button></div>';return}panel()}
const out=async()=>{await sb.auth.signOut();boot()};
function loginView(){$("app").innerHTML=`<h2>Admin sign in</h2><div class="card"><label>Email</label><input id="e" type="email"><label>Password</label><input id="p" type="password"><br><button class="btn" id="b" style="width:100%">Sign in</button></div>`;
 $("b").onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$("e").value.trim(),password:$("p").value});error?toast(error.message):boot()}}
const COL=["#2b6cb3","#f2c230","#1f9d63","#d64545","#8a5cd6","#e07b39"];
function donut(a,b,la,lb){const t=a+b,p=t?Math.round(a/t*100):0;return `<div style="width:130px;height:130px;border-radius:50%;margin:8px auto;background:conic-gradient(#2b6cb3 0 ${p}%,#d5e6f0 ${p}% 100%);display:flex;align-items:center;justify-content:center"><div style="width:84px;height:84px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px">${p}%</div></div><div class="mut"><span style="color:#2b6cb3">■</span> ${la} ${a} &nbsp; <span style="color:#a9c4d6">■</span> ${lb} ${b}</div>`}
function charts(R,C){return POS.map(p=>p.k).filter(k=>R.some(x=>x.pos===k)).map(k=>{const l=R.filter(x=>x.pos===k).sort((a,b)=>b.cnt-a.cnt),tot=l.reduce((s,x)=>s+x.cnt,0),mx=Math.max(1,...l.map(x=>x.cnt));return `<div class="card"><h3>${esc(P(k).n)} <span class="mut">· ${tot} votes</span></h3>${l.map((x,i)=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${esc((C.find(c=>c.id===x.cand_id)||{}).name)}</span><b>${x.cnt} <span class="mut">(${tot?Math.round(x.cnt/tot*100):0}%)</span></b></div><div style="height:14px;background:#e3eff6;border-radius:7px;overflow:hidden"><i style="display:block;height:100%;width:${x.cnt/mx*100}%;background:${COL[i%COL.length]}"></i></div></div>`).join("")}</div>`}).join("")||'<div class="card mut">No data yet.</div>'}
async function printReport(kind){const{data:C}=await sb.from("candidates").select("id,name,reg_no,phone,email,position,txn_id,status").order("created_at"),{data:V}=await sb.from("voters").select("reg_no"),{count:roll}=await sb.from("voter_roll").select("*",{count:"exact",head:true});let R=[];try{R=await rpc("get_results")}catch(e){}
 const ver=C.filter(c=>c.status==="verified").length,vt=V.length,tp=roll?Math.round(vt/roll*100):0,nm=id=>(C.find(c=>c.id===id)||{});
 const head=`<div class="ph-head"><img src="logo-tamsa.png"><div><h1>TAMSA SUZA ELECTIONS</h1><div>Tanzania Medical Students’ Association · State University of Zanzibar</div></div><img src="logo-suza.jpg"></div>`;let body;
 if(kind==="results"){body=`<h2>OFFICIAL RESULTS REPORT</h2><table class="pt"><tr><td>Applicants<b>${C.length}</b></td><td>Verified candidates<b>${ver}</b></td><td>Registered voters<b>${roll||0}</b></td><td>Votes cast<b>${vt}</b></td><td>Turnout<b>${tp}%</b></td></tr></table>`
  +POS.map(p=>p.k).filter(k=>R.some(x=>x.pos===k)).map(k=>{const l=R.filter(x=>x.pos===k).sort((a,b)=>b.cnt-a.cnt),tot=l.reduce((s,x)=>s+x.cnt,0);return `<h3>${esc(P(k).n)}</h3><table class="pt"><tr><th>#</th><th>Candidate</th><th>Reg. no.</th><th>Votes</th><th>%</th><th>Outcome</th></tr>${l.map((x,i)=>`<tr class="${i<P(k).seats&&x.cnt?"win":""}"><td>${i+1}</td><td>${esc(nm(x.cand_id).name)}</td><td>${esc(nm(x.cand_id).reg_no)}</td><td>${x.cnt}</td><td>${tot?Math.round(x.cnt/tot*100):0}%</td><td>${i<P(k).seats&&x.cnt?"ELECTED":""}</td></tr>`).join("")}</table>`}).join("")
  +`<div class="pb"></div><h2>CHARTS</h2><div class="grid"><div class="card" style="text-align:center"><h3>Turnout</h3>${donut(vt,Math.max((roll||0)-vt,0),"Voted","Not yet")}</div><div class="card" style="text-align:center"><h3>Candidates</h3>${donut(ver,C.length-ver,"Verified","Pending")}</div></div>`+charts(R,C)}
 else body=`<h2>CANDIDATES &amp; PAYMENTS REGISTER</h2><table class="pt"><tr><th>#</th><th>Name</th><th>Reg. no.</th><th>Position</th><th>Phone</th><th>Email</th><th>Txn ID</th><th>Status</th></tr>${C.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.name)}</td><td>${esc(c.reg_no)}</td><td>${esc(P(c.position).n)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${esc(c.txn_id)}</td><td>${esc(c.status)}</td></tr>`).join("")}</table>`;
 $("pr").innerHTML=head+body+`<div class="sig"><div>Electoral Committee Chairperson</div><div>Election Admin</div><div>Date</div></div><div class="ph-foot">Generated ${new Date().toLocaleString()} · TAMSA SUZA Digital Election System</div>`;setTimeout(()=>window.print(),400)}
async function panel(){const S=await getSettings(),{data:C}=await sb.from("candidates").select("id,name,reg_no,phone,email,position,txn_id,status").order("created_at"),{data:V}=await sb.from("voters").select("reg_no"),{count:roll}=await sb.from("voter_roll").select("*",{count:"exact",head:true});
 let R=[];try{R=await rpc("get_results")}catch(e){}window.W=winners(R,C);const sw=(k,l)=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span>${l}</span><button class="btn s ${S[k]?"":"o"}" onclick="tg('${k}',${!S[k]})">${S[k]?"ON — tap to turn off":"OFF — tap to turn on"}</button></div>`;
 $("app").innerHTML=`<h2>Control panel</h2><div class="card">${sw("reg_open","Candidate applications")}${sw("voting_open","Voting")}${sw("results_published","Publish results")}</div>
 <div class="stat"><div><b>${C.length}</b>Applicants</div><div><b>${C.filter(c=>c.status==="pending").length}</b>To verify</div><div><b>${V.length}</b>Votes cast</div><div><b>${roll||0}</b>Voter roll</div></div>
 <h2>Statistics</h2><div class="grid"><div class="card" style="text-align:center"><h3>Turnout</h3>${donut(V.length,Math.max((roll||0)-V.length,0),"Voted","Not yet")}</div><div class="card" style="text-align:center"><h3>Candidates</h3>${donut(C.filter(c=>c.status==="verified").length,C.filter(c=>c.status!=="verified").length,"Verified","Pending")}</div></div><h2>Votes by position</h2>${charts(R,C)}<h2>Candidates &amp; payments</h2><div class="card">${C.map(c=>`<div style="border-bottom:1px solid var(--bd);padding:10px 0"><div class="row" style="justify-content:space-between"><b>${esc(c.name)}</b><span class="tag ${c.status==="verified"?"ok":c.status==="removed"?"bad":"w"}">${c.status}</span></div><div class="mut">${esc(c.reg_no)} · ${esc(c.phone)} · ${esc(c.email)} · ${esc(P(c.position).n)}${c.txn_id?" · Txn <b>"+esc(c.txn_id)+"</b>":""}</div>
 <div class="row" style="margin-top:6px">${c.status==="pending"?`<button class="btn s" onclick="st('${c.id}','verified')">Verify payment</button>`:""}${c.status==="verified"&&c.email?`<a class="btn s o" href="mailto:${esc(c.email)}?subject=${encodeURIComponent('TAMSA SUZA: payment verified')}&body=${encodeURIComponent('Hello '+c.name+', your payment is verified and your candidacy is now live. Good luck!')}">Email candidate</a>`:""}<button class="btn s r" onclick="del('${c.id}')">Delete permanently</button></div></div>`).join("")||'<span class="mut">No applicants yet.</span>'}</div>
 <h2>Voter roll</h2><div class="card"><p class="mut">Register voters here. Paste one per line (any format): <code>MD/00/00/001/TZ, Full Name</code>. Only students on this list can vote.</p><textarea id="vr" rows="5"></textarea><br><div class="row"><button class="btn s" onclick="roll()">Upload</button></div></div>
 <h2>Elected candidates</h2><div class="card">${window.W.map((w,i)=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)"><div><b>${esc(w.c.name)}</b><div class="mut">${esc(P(w.k).n)} · ${w.cnt} votes${w.c.email?" · "+esc(w.c.email):" · no email"}</div></div><button class="btn s g" onclick="mailOne(${i})">✉ Congratulate</button></div>`).join("")||'<span class="mut">Winners appear here once votes are cast.</span>'}</div><h2>Print &amp; export</h2><div class="row"><button class="btn s" onclick="printReport('results')">🖨 Print results report</button><button class="btn s o" onclick="printReport('cands')">🖨 Print candidates register</button><button class="btn s g" onclick="mailElected()">✉ Email elected candidates</button><button class="btn s o" onclick="copyEmails()">Copy elected emails</button><button class="btn o s" onclick="csv()">Download results CSV</button><button class="btn o s" onclick="out()">Sign out</button></div>`}
function winners(R,C){const o=[];POS.map(p=>p.k).forEach(k=>R.filter(x=>x.pos===k).sort((a,b)=>b.cnt-a.cnt).slice(0,P(k).seats).filter(x=>x.cnt>0).forEach(x=>{const c=C.find(y=>y.id===x.cand_id);if(c)o.push({c,k,cnt:x.cnt})}));return o}
function mailOne(i){const w=window.W[i],c=w.c;if(!c.email)return toast("This candidate has no email");
 const sub=encodeURIComponent("Congratulations "+c.name+" — "+P(w.k).n+", TAMSA SUZA"),body=encodeURIComponent("Dear "+c.name+",\n\nCongratulations! You have been elected as "+P(w.k).n+" in the TAMSA SUZA elections. The election committee will contact you with the next steps.\n\nTAMSA SUZA Election Committee");
 location.href="mailto:"+c.email+"?subject="+sub+"&body="+body}
async function elected(){const{data:C}=await sb.from("candidates").select("id,name,email,position");let R=[];try{R=await rpc("get_results")}catch(e){}
 const out=[];POS.map(p=>p.k).forEach(k=>R.filter(x=>x.pos===k).sort((a,b)=>b.cnt-a.cnt).slice(0,P(k).seats).filter(x=>x.cnt>0).forEach(x=>{const c=C.find(y=>y.id===x.cand_id);if(c&&c.email)out.push(c)}));return out}
async function mailElected(){const l=await elected();if(!l.length)return toast("No elected candidates with an email yet");
 const sub=encodeURIComponent("TAMSA SUZA Elections: Congratulations!"),body=encodeURIComponent("Dear elected leader,\n\nCongratulations! You have been elected in the TAMSA SUZA elections. The election committee will contact you with the next steps.\n\nTAMSA SUZA Election Committee");
 location.href="mailto:?bcc="+l.map(c=>c.email).join(",")+"&subject="+sub+"&body="+body}
async function copyEmails(){const l=await elected();if(!l.length)return toast("No elected candidates with an email yet");const t=l.map(c=>c.email).join(", ");try{await navigator.clipboard.writeText(t);toast(l.length+" emails copied")}catch(e){prompt("Copy these emails:",t)}}
async function del(id){if(!confirm('Delete this candidate and all their votes permanently? This cannot be undone.'))return;const{error}=await sb.from('candidates').delete().eq('id',id);toast(error?error.message:'Deleted');panel()}
async function tg(k,v){const{error}=await sb.from("settings").update({[k]:v}).eq("id",1);if(error)toast(error.message);panel()}
async function st(id,s){const{error}=await sb.from("candidates").update({status:s}).eq("id",id);if(error)toast(error.message);panel()}
async function roll(){const rows=$("vr").value.split("\n").map(l=>l.split(/[,\t;]/)).filter(a=>a[0].trim()).map(a=>({reg_no:a[0].trim().toUpperCase(),full_name:(a[1]||"").trim()}));if(!rows.length)return;const{error}=await sb.from("voter_roll").upsert(rows);toast(error?error.message:rows.length+" voters saved");panel()}
async function csv(){const R=await rpc("get_results"),{data:C}=await sb.from("candidates").select("id,name");const t="position,candidate,votes\n"+R.map(r=>[P(r.pos).n,(C.find(c=>c.id===r.cand_id)||{}).name,r.cnt].join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="results.csv";a.click()}
boot();
</script></body></html>
